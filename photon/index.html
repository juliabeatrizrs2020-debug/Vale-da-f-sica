
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTON: Break the Light</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030713;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
.panel{background:#07152b;border:1px solid #1adfff;border-radius:8px;padding:9px}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020817e8;text-align:center;padding:25px}
.box{max-width:420px}
h1{color:#65f5ff;letter-spacing:4px;text-shadow:0 0 20px #00dfff}
button{background:#082b48;color:white;border:1px solid #26eaff;border-radius:10px;padding:13px 18px;font-weight:bold}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px}
.group{display:flex;gap:7px}
#controls button{width:48px;height:52px;font-size:18px;padding:5px}
#fire{width:68px!important;color:#70f8ff}
small{color:#b8d9e8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="panel">ENERGIA: <span id="energy">100</span>%</div>
<div class="panel">NÚCLEOS: <span id="cores">0</span>/3</div>
<div class="panel">PONTOS: <span id="score">0</span></div>
</div>
<div id="message">
<div class="box">
<h1>PHOTON</h1>
<h3>BREAK THE LIGHT</h3>
<p>Recupere os três núcleos de luz e sobreviva aos drones.</p>
<p><small>Desvie dos inimigos e dispare pulsos de fótons.</small></p>
<label for="playerName">SEU NOME OU APELIDO</label>
<input id="playerName" type="text" maxlength="16" placeholder="Digite seu nome">

<label for="difficulty">NÍVEL DE DIFICULDADE</label>
<select id="difficulty">
  <option value="easy">FÁCIL</option>
  <option value="medium" selected>MÉDIO</option>
  <option value="hard">DIFÍCIL</option>
</select>

<button id="start">INICIAR MISSÃO</button>
</div>
</div>
<div id="controls">
<div class="group">
<button id="left">◀</button>
<button id="right">▶</button>
</div>
<div class="group">
<button id="up">▲</button>
<button id="down">▼</button>
<button id="fire">PULSO</button>
</div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=0,H=0;
function resize(){
W=innerWidth;H=innerHeight;
canvas.width=W*devicePixelRatio;
canvas.height=H*devicePixelRatio;
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize);resize();
const $=id=>document.getElementById(id);
let player,enemies,cores,shots,particles,score,energy,collected,running=false,last=0,spawn=0,shotTimer=0;

let playerName = "";
let difficulty = "medium";

const difficultySettings = {
  easy: {spawn:1450, enemyMin:1.0, enemyMax:1.7, energy:120},
  medium: {spawn:1050, enemyMin:1.4, enemyMax:2.5, energy:100},
  hard: {spawn:750, enemyMin:2.0, enemyMax:3.2, energy:80}
};
let keys={};
let stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),s:Math.random()*2+0.5}));
function reset(){
player={x:W/2,y:H-100,r:14,speed:4.2,hit:0};
enemies=[];shots=[];particles=[];
cores=[
{x:W*.22,y:H*.25,r:12,got:false},
{x:W*.75,y:H*.40,r:12,got:false},
{x:W*.48,y:H*.17,r:12,got:false}
];
score=0;
energy=difficultySettings[difficulty].energy;
collected=0;
spawn=0;
shotTimer=0;
updateHud();
}
function updateHud(){
$("energy").textContent=Math.max(0,Math.floor(energy));
$("cores").textContent=collected;
$("score").textContent=score;
}
function start(){
playerName=$("playerName").value.trim();
if(!playerName){
alert("Digite seu nome ou apelido!");
return;
}
difficulty=$("difficulty").value;
reset();
running=true;
$("message").style.display="none";
last=performance.now();
requestAnimationFrame(loop);
}
$("start").onclick=start;
function bind(id,key){
const b=$(id);
b.addEventListener("pointerdown",e=>{
e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId);
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));
}
bind("left","left");bind("right","right");
bind("up","up");bind("down","down");bind("fire","fire");
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
function shoot(){
if(shotTimer>0)return;
shots.push({x:player.x,y:player.y-18,v:-8,r:4});
shotTimer=13;
}
function burst(x,y,color){
for(let i=0;i<9;i++){
let a=Math.random()*Math.PI*2,v=Math.random()*3+1;
particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:28,color});
}
}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r;}
function update(dt){
let step=Math.min(dt/16.67,2),dx=0,dy=0;
if(keys.left||keys.arrowleft)dx--;
if(keys.right||keys.arrowright)dx++;
if(keys.up||keys.arrowup)dy--;
if(keys.down||keys.arrowdown)dy++;
if(dx&&dy){dx*=.707;dy*=.707}
player.x=Math.max(18,Math.min(W-18,player.x+dx*player.speed*step));
player.y=Math.max(65,Math.min(H-35,player.y+dy*player.speed*step));
if(keys.fire||keys[" "])shoot();
if(shotTimer>0)shotTimer-=step;
spawn+=dt;
if(spawn>difficultySettings[difficulty].spawn){
spawn=0;
let settings=difficultySettings[difficulty];
enemies.push({
x:30+Math.random()*(W-60),
y:-25,
r:13,
s:settings.enemyMin+Math.random()*(settings.enemyMax-settings.enemyMin)
});
}
shots.forEach(s=>s.y+=s.v*step);
shots=shots.filter(s=>s.y>-20);
enemies.forEach(e=>e.y+=e.s*step);
for(let i=enemies.length-1;i>=0;i--){
let e=enemies[i];
for(let j=shots.length-1;j>=0;j--){
if(hit(e,shots[j])){
burst(e.x,e.y,"#ff4dd8");score+=15;
enemies.splice(i,1);shots.splice(j,1);break;
}
}
if(enemies[i]&&hit(player,e)){
energy-=15;player.hit=12;
burst(e.x,e.y,"#ff5577");enemies.splice(i,1);
}else if(enemies[i]&&e.y>H+20)enemies.splice(i,1);
}
cores.forEach(c=>{
if(!c.got&&hit(player,c)){
c.got=true;collected++;score+=50;
energy=Math.min(100,energy+10);
burst(c.x,c.y,"#62f5ff");
}
});
particles.forEach(p=>{
p.x+=p.vx*step;p.y+=p.vy*step;p.life-=step;
});
particles=particles.filter(p=>p.life>0);
score+=Math.floor(step);updateHud();
if(energy<=0){end(false);return}
if(collected===3){end(true);return}
}
function draw(){
ctx.clearRect(0,0,W,H);
let grd=ctx.createLinearGradient(0,0,0,H);
grd.addColorStop(0,"#07132e");grd.addColorStop(1,"#02050e");
ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
stars.forEach(s=>{
s.y+=.0007;if(s.y>1)s.y=0;
ctx.fillStyle="#75dfff";ctx.globalAlpha=.35+s.s*.2;
ctx.fillRect(s.x*W,s.y*H,s.s,s.s);
});
ctx.globalAlpha=1;ctx.strokeStyle="#12365c";
for(let y=H*.48;y<H;y+=34){
ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
}
for(let x=0;x<W;x+=45){
ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.15,H*.48);
ctx.lineTo(x,H);ctx.stroke();
}
cores.forEach(c=>{
if(c.got)return;
ctx.save();ctx.shadowBlur=22;ctx.shadowColor="#00eeff";
ctx.strokeStyle="#8bffff";ctx.lineWidth=3;
ctx.beginPath();ctx.arc(c.x,c.y,c.r+Math.sin(Date.now()/180)*3,0,Math.PI*2);ctx.stroke();
ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(c.x,c.y,4,0,Math.PI*2);ctx.fill();
ctx.restore();
});
shots.forEach(s=>{
ctx.shadowBlur=15;ctx.shadowColor="#55ffff";
ctx.fillStyle="#baffff";ctx.fillRect(s.x-2,s.y-10,4,15);
});
ctx.shadowBlur=0;
enemies.forEach(e=>{
ctx.save();ctx.shadowBlur=16;ctx.shadowColor="#ff36bc";
ctx.fillStyle="#a5268d";ctx.beginPath();
ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);
ctx.lineTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y);
ctx.closePath();ctx.fill();ctx.strokeStyle="#ff9be7";ctx.stroke();ctx.restore();
});
particles.forEach(p=>{
ctx.globalAlpha=Math.max(0,p.life/28);
ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3);
});
ctx.globalAlpha=1;
ctx.save();ctx.translate(player.x,player.y);
ctx.shadowBlur=22;ctx.shadowColor="#00eaff";
ctx.fillStyle=player.hit>0?"#ff5577":"#35dfff";
ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(15,14);
ctx.lineTo(0,8);ctx.lineTo(-15,14);ctx.closePath();ctx.fill();
ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,-3,4,0,Math.PI*2);ctx.fill();
ctx.restore();if(player.hit>0)player.hit--;
}
function end(win){
running=false;

let best=Number(localStorage.getItem("photonBest")||0);
if(score>best){
best=score;
localStorage.setItem("photonBest",best);
}

$("message").style.display="flex";
$("message").innerHTML=
'<div class="box"><h1>'+(win?"MISSÃO CONCLUÍDA":"FIM DE JOGO")+
'</h1><h3>'+(win?"VOCÊ RECUPEROU A LUZ!":"A ENERGIA ACABOU")+
'</h3><p>Jogador: '+playerName+
'</p><p>Pontuação: '+score+
'</p><p>Recorde neste aparelho: '+best+
'</p><button id="again">JOGAR NOVAMENTE</button></div>';

$("again").onclick=start;
}
function loop(now){
if(!running)return;
let dt=now-last;last=now;update(dt);draw();
if(running)requestAnimationFrame(loop);
}
reset();draw();
</script>
</body>
</html>
