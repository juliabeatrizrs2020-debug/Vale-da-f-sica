
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>NEXUS | Jogos de Física</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #17245a, #050816 65%);

      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    main {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

      text-shadow: 0 0 20px #00d9ff;
    }

    .subtitle {
      color: #b9c7e8;

    }

    .game {
      display: block;
      text-decoration: none;
      color: white;
      padding: 28px;
      margin: 20px 0;
      border: 1px solid #35dfff;
      border-radius: 16px;
      background: #101a38;
      transition: 0.2s;
    }

    .game:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px #00d9ff;
    }

    .game h2 {
      color: #62f5ff;
      margin-top: 0;
    }

    .game p {
      color: #c5cee5;
    }

    footer {
      margin-top: 35px;
      color: #7785a8;
      font-size: 12px;
    }

  <main>
